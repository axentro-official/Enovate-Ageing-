<script>
// ===================== STATE MANAGEMENT =====================
const APP_KEY = 'axentro_data';
let state = {
  currentView: 'dashboard',
  viewParams: null,
  darkMode: true,
  sidebarOpen: false,
  invoices: [],
  customers: [],
  collections: [],
  attachments: [],
  auditLogs: [],
  notifications: [],
  settings: { companyName:'AXENTRO Corp.',logo:'',address:'Riyadh, Kingdom of Saudi Arabia',phone:'+966 11 234 5678',email:'info@axentro.com',taxNumber:'300012345600003',commercialReg:'1010123456' },
  user: { id:'u1',name:'Admin User',role:'admin' }
};

function saveState(){ try{ localStorage.setItem(APP_KEY, JSON.stringify({invoices:state.invoices,customers:state.customers,collections:state.collections,attachments:state.attachments,auditLogs:state.auditLogs,notifications:state.notifications,settings:state.settings})); }catch(e){} }
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(APP_KEY));
    if(d&&d.invoices&&d.invoices.length){ Object.assign(state,d); return true; }
  }catch(e){}
  return false;
}

// ===================== SAMPLE DATA GENERATION =====================
function generateSampleData(){
  const customers=[
    {id:'c1',name:'Al-Rashid Trading Co.',taxNumber:'300012345600003',commercialReg:'1010123456',contactPerson:'Ahmed Al-Rashid',phone:'+966 50 123 4567',email:'ahmed@alrashid.sa',address:'Riyadh, King Fahd Road, Tower A',notes:'Premium customer since 2020',createdAt:'2024-01-15T08:00:00Z'},
    {id:'c2',name:'Gulf Star Electronics',taxNumber:'300098765400001',commercialReg:'1010987654',contactPerson:'Sara Khalid',phone:'+966 55 987 6543',email:'sara@gulfstar.sa',address:'Jeddah, Palestine Street',notes:'Quarterly bulk orders',createdAt:'2024-01-20T09:00:00Z'},
    {id:'c3',name:'Saudi Construction Group',taxNumber:'300056789000002',commercialReg:'1010567890',contactPerson:'Mohammed Al-Faisal',phone:'+966 54 567 8901',email:'mohammed@scg.sa',address:'Dammam, King Abdulaziz Rd',notes:'Large project-based invoicing',createdAt:'2024-02-01T10:00:00Z'},
    {id:'c4',name:'Emirates Logistics LLC',taxNumber:'300034567800004',commercialReg:'1010345678',contactPerson:'Fatima Al-Mansoor',phone:'+971 50 345 6789',email:'fatima@emlogistics.ae',address:'Dubai, Sheikh Zayed Road',notes:'Cross-border logistics partner',createdAt:'2024-02-10T11:00:00Z'},
    {id:'c5',name:'Qatar Petroleum Services',taxNumber:'300078901200005',commercialReg:'1010789012',contactPerson:'Ali Al-Thani',phone:'+974 33 789 0123',email:'ali@qpservices.qa',address:'Doha, West Bay Area',notes:'Government contract supplier',createdAt:'2024-02-15T12:00:00Z'},
    {id:'c6',name:'Bahrain Steel Industries',taxNumber:'300067890100006',commercialReg:'1010678901',contactPerson:'Hassan Al-Bahraini',phone:'+973 17 678 9012',email:'hassan@bahrainsteel.bh',address:'Manama, Sitra Industrial Area',notes:'Steel and metals supplier',createdAt:'2024-03-01T08:30:00Z'},
    {id:'c7',name:'Oman Cement Factory',taxNumber:'300045678900007',commercialReg:'1010456789',contactPerson:'Khalid Al-Omani',phone:'+968 99 456 7890',email:'khalid@omancement.om',address:'Muscat, Rusayl Industrial Estate',notes:'Regular cement orders',createdAt:'2024-03-10T09:30:00Z'},
    {id:'c8',name:'Kuwait Food Industries',taxNumber:'300089012300008',commercialReg:'1010890123',contactPerson:'Noura Al-Kuwaiti',phone:'+965 66 890 1234',email:'noura@kfi.kw',address:'Kuwait City, Shuwaikh Industrial',notes:'Food sector client',createdAt:'2024-03-20T10:30:00Z'},
    {id:'c9',name:'Neom Tech Solutions',taxNumber:'300023456700009',commercialReg:'1010234567',contactPerson:'Omar Al-Neomi',phone:'+966 52 345 6789',email:'omar@neomtech.sa',address:'NEOM, Innovation District',notes:'High-tech solutions partner',createdAt:'2024-04-01T11:30:00Z'},
    {id:'c10',name:'Red Sea Development Co.',taxNumber:'300012345600010',commercialReg:'1010111222',contactPerson:'Layla Al-Riyadh',phone:'+966 53 111 2233',email:'layla@redseadev.sa',address:'Tabuk, Red Sea Coast',notes:'Tourism development project',createdAt:'2024-04-10T12:30:00Z'}
  ];
  const descs=['Consulting Services','IT Infrastructure Setup','Software Development','Maintenance Contract','Project Management','Equipment Supply','Training Services','Security Systems','Network Installation','Cloud Services','Data Analysis','Quality Assurance'];
  const invoices=[];
  const collections=[];
  let invNum=1001;
  for(let m=0;m<12;m++){
    const month=m+1;
    const count=4+Math.floor(Math.random()*5);
    for(let i=0;i<count;i++){
      const cust=customers[Math.floor(Math.random()*customers.length)];
      const day=1+Math.floor(Math.random()*28);
      const vatPct=[5,15,15,15][Math.floor(Math.random()*4)];
      const desc=descs[Math.floor(Math.random()*descs.length)];
      const qty=Math.floor(1+Math.random()*20);
      const unitPrice=parseFloat((500+Math.random()*9500).toFixed(2));
      const subtotal=parseFloat((qty*unitPrice).toFixed(2));
      const vatAmount=parseFloat((subtotal*vatPct/100).toFixed(2));
      const totalAfterTax=parseFloat((subtotal+vatAmount).toFixed(2));
      const taxDedPct=Math.random()>.6?parseFloat((2+Math.random()*3).toFixed(1)):0;
      const laborPct=Math.random()>.7?parseFloat((1+Math.random()*2).toFixed(1)):0;
      const insPct=Math.random()>.8?parseFloat((0.5+Math.random()*1).toFixed(1)):0;
      const taxDedAmt=parseFloat((totalAfterTax*taxDedPct/100).toFixed(2));
      const laborAmt=parseFloat((totalAfterTax*laborPct/100).toFixed(2));
      const insAmt=parseFloat((totalAfterTax*insPct/100).toFixed(2));
      const netReceivable=parseFloat((totalAfterTax-taxDedAmt-laborAmt-insAmt).toFixed(2));
      const invId='inv'+(m*10+i+1);
      const invDate=new Date(2024,month-1,day);
      const dueDate=new Date(invDate);dueDate.setDate(dueDate.getDate()+30+Math.floor(Math.random()*30));
      const rand=Math.random();
      let status='Unpaid';
      let totalCollected=0;
      if(rand>.3){
        const colAmt=rand>.7?netReceivable:parseFloat((netReceivable*(0.2+Math.random()*0.5)).toFixed(2));
        totalCollected=colAmt;
        status=colAmt>=netReceivable?'Fully Paid':'Partially Paid';
        const colDay=day+5+Math.floor(Math.random()*20);
        collections.push({id:'col'+collections.length,invoiceId:invId,collectionDate:new Date(2024,month-1,Math.min(colDay,28)).toISOString().split('T')[0],amount:colAmt,referenceNumber:'RCV-'+(2024000+collections.length),notes:'Payment received',createdAt:new Date(2024,month-1,Math.min(colDay,28)).toISOString()});
        if(rand>.7&&Math.random()>.5){
          const col2=netReceivable-colAmt;
          if(col2>0){
            const colDay2=colDay+10+Math.floor(Math.random()*15);
            collections.push({id:'col'+collections.length,invoiceId:invId,collectionDate:new Date(2024,month-1,Math.min(colDay2,28)).toISOString().split('T')[0],amount:parseFloat(col2.toFixed(2)),referenceNumber:'RCV-'+(2024000+collections.length),notes:'Final payment',createdAt:new Date(2024,month-1,Math.min(colDay2,28)).toISOString()});
            totalCollected=netReceivable;status='Fully Paid';
          }
        }
      }
      const remaining=parseFloat((netReceivable-totalCollected).toFixed(2));
      invoices.push({id:invId,internalId:'AXN-'+String(invNum).padStart(6,'0'),invoiceNumber:'INV-2024-'+String(invNum).padStart(4,'0'),customerId:cust.id,invoiceDate:invDate.toISOString().split('T')[0],dueDate:dueDate.toISOString().split('T')[0],items:[{description:desc,qty,unitPrice,total:subtotal}],subtotal,vatPercent:vatPct,vatAmount,totalAfterTax,taxDeductionPercent:taxDedPct,taxDeductionAmount:taxDedAmt,laborCertPercent:laborPct,laborCertAmount:laborAmt,insurancePercent:insPct,insuranceAmount:insAmt,netReceivable,totalCollected:parseFloat(totalCollected.toFixed(2)),remainingBalance:remaining,status,createdAt:invDate.toISOString(),updatedAt:invDate.toISOString()});
      invNum++;
    }
  }
  const auditLogs=[];
  invoices.forEach(inv=>{
    auditLogs.push({id:'al'+auditLogs.length,userId:'u1',userName:'Admin User',action:'Created',entity:'invoice',entityId:inv.id,details:'Invoice '+inv.invoiceNumber+' created',timestamp:inv.createdAt});
  });
  collections.forEach(col=>{
    auditLogs.push({id:'al'+auditLogs.length,userId:'u1',userName:'Admin User',action:'Collection Added',entity:'collection',entityId:col.id,details:'Collection '+col.referenceNumber+' for '+col.amount+' SAR',timestamp:col.createdAt});
  });
  const notifications=[
    {id:'n1',title:'Invoice Due Soon',message:'INV-2024-1012 is due in 3 days',type:'warning',read:false,timestamp:new Date(Date.now()-3600000).toISOString()},
    {id:'n2',title:'Payment Received',message:'Collection RCV-2024005 of 15,000 SAR received',type:'success',read:false,timestamp:new Date(Date.now()-7200000).toISOString()},
    {id:'n3',title:'New Invoice Created',message:'INV-2024-1048 has been created and needs review',type:'info',read:false,timestamp:new Date(Date.now()-86400000).toISOString()}
  ];
  state.customers=customers;state.invoices=invoices;state.collections=collections;state.attachments=[];state.auditLogs=auditLogs;state.notifications=notifications;
  saveState();
}

// ===================== UTILITY FUNCTIONS =====================
function fmt(n){ return new Intl.NumberFormat('en-SA',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0); }
function fmtDate(d){ if(!d)return'-'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ if(!d)return'-'; return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function genId(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6); }
function daysBetween(d1,d2){ return Math.floor((new Date(d2)-new Date(d1))/(1000*60*60*24)); }
function getCustomer(id){ return state.customers.find(c=>c.id===id)||{name:'Unknown',taxNumber:'-'}; }
function getInvoiceCollections(invId){ return state.collections.filter(c=>c.invoiceId===invId); }
function recalcInvoice(inv){
  const subtotal=parseFloat(inv.items.reduce((s,it)=>s+(it.qty*it.unitPrice),0).toFixed(2));
  const vatAmount=parseFloat((subtotal*(inv.vatPercent||0)/100).toFixed(2));
  const totalAfterTax=parseFloat((subtotal+vatAmount).toFixed(2));
  const taxDedAmt=parseFloat((totalAfterTax*(inv.taxDeductionPercent||0)/100).toFixed(2));
  const laborAmt=parseFloat((totalAfterTax*(inv.laborCertPercent||0)/100).toFixed(2));
  const insAmt=parseFloat((totalAfterTax*(inv.insurancePercent||0)/100).toFixed(2));
  const netReceivable=parseFloat((totalAfterTax-taxDedAmt-laborAmt-insAmt).toFixed(2));
  const totalCollected=parseFloat(getInvoiceCollections(inv.id).reduce((s,c)=>s+c.amount,0).toFixed(2));
  const remaining=parseFloat((netReceivable-totalCollected).toFixed(2));
  let status='Unpaid';if(remaining<=0)status='Fully Paid';else if(totalCollected>0)status='Partially Paid';
  Object.assign(inv,{subtotal,vatAmount,totalAfterTax,taxDeductionAmount:taxDedAmt,laborCertAmount:laborAmt,insuranceAmount:insAmt,netReceivable,totalCollected,remainingBalance:Math.max(0,remaining),status,updatedAt:new Date().toISOString()});
}

function revenueTrendChart(){
  const ctx=document.getElementById('revenue-trend-chart');if(!ctx)return;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const data=months.map((_,i)=>{
    return state.invoices.filter(inv=>{const d=new Date(inv.invoiceDate);return d.getMonth()===i;}).reduce((s,inv)=>s+inv.totalAfterTax,0);
  });
  const colData=months.map((_,i)=>{
    const invIds=state.invoices.filter(inv=>{const d=new Date(inv.invoiceDate);return d.getMonth()===i;}).map(inv=>inv.id);
    return state.collections.filter(c=>invIds.includes(c.invoiceId)).reduce((s,c)=>s+c.amount,0);

  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{usePointStyle:true,pointStyle:'circle',padding:20,font:{size:12}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},grid:{color:state.darkMode?'rgba(255,255,255,.04)':'rgba(0,0,0,.04)'}},x:{grid:{display:false}}}}});

function agingChart(){
  const ctx=document.getElementById('aging-chart');if(!ctx)return;

  const data=cats.map((_,i)=>{let min=i===0?-999:i===1?0:i===2?31:i===3?61:91;let max=i===0?0:i===1?30:i===2?60:i===3?90:9999;
    return state.invoices.filter(inv=>{if(inv.status==='Fully Paid')return false;const days=daysBetween(inv.dueDate,now);return days>=min&&days<=max;}).reduce((s,inv)=>s+inv.remainingBalance,0);
  });

function statusBadge(status){

function renderLineItemRow(item,i){

    <div class="col-span-3 md:col-span-2"><label class="block text-xs text-surface-500 mb-1">Total</label><div class="px-3 py-2 rounded-lg text-sm font-medium text-white bg-white/5" id="item_total_${i}">${fmt(item.total||0)}</div></div>

let lineItemCount=0;
function addLineItem(){const c=document.getElementById('line-items');lineItemCount=c.children.length;const div=document.createElement('div');div.innerHTML=renderLineItemRow({description:'',qty:1,unitPrice:0,total:0},lineItemCount);c.appendChild(div.firstElementChild);lucide.createIcons({nodes:[c]});calcPreview();}
function removeLineItem(i){const rows=document.getElementById('line-items').children;if(rows.length<=1){showToast('Must have at least one item','warning');return;}rows[i]?.remove();calcPreview();}
function calcPreview(){
  const rows=document.getElementById('line-items')?.children;if(!rows)return;
  let subtotal=0;
  Array.from(rows).forEach((row,i)=>{
    const q=parseFloat(row.querySelector(`[name="item_qty_${i}"]`)?.value)||0;
    const p=parseFloat(row.querySelector(`[name="item_price_${i}"]`)?.value)||0;
    const t=parseFloat((q*p).toFixed(2));subtotal+=t;
    const el=document.getElementById('item_total_'+i);if(el)el.textContent=fmt(t);
  });
  const vatPct=parseFloat(document.querySelector('[name="taxDeductionPercent"]')?.closest('.glass')?.previousElementSibling?.querySelector?.('[name="vatPercent"]')?.value||15);
  // Get VAT from first deduction input's form context - we need to add VAT input
  const vatAmount=parseFloat((subtotal*15/100).toFixed(2));
  const totalAfterTax=parseFloat((subtotal+vatAmount).toFixed(2));
  const taxDedPct=parseFloat(document.querySelector('[name="taxDeductionPercent"]')?.value||0);
  const laborPct=parseFloat(document.querySelector('[name="laborCertPercent"]')?.value||0);
  const insPct=parseFloat(document.querySelector('[name="insurancePercent"]')?.value||0);
  const taxDedAmt=parseFloat((totalAfterTax*taxDedPct/100).toFixed(2));
  const laborAmt=parseFloat((totalAfterTax*laborPct/100).toFixed(2));
  const insAmt=parseFloat((totalAfterTax*insPct/100).toFixed(2));
  const net=parseFloat((totalAfterTax-taxDedAmt-laborAmt-insAmt).toFixed(2));
  const s=id=>document.getElementById(id);
  if(s('prev-subtotal'))s('prev-subtotal').textContent=fmt(subtotal);
  if(s('prev-vat-pct'))s('prev-vat-pct').textContent='15';
  if(s('prev-vat'))s('prev-vat').textContent=fmt(vatAmount);
  if(s('prev-total'))s('prev-total').textContent=fmt(totalAfterTax);
  if(s('prev-tax-ded'))s('prev-tax-ded').textContent=fmt(taxDedAmt);
  if(s('prev-labor'))s('prev-labor').textContent=fmt(laborAmt);
  if(s('prev-ins'))s('prev-ins').textContent=fmt(insAmt);
  if(s('prev-tax-ded2'))s('prev-tax-ded2').textContent=fmt(taxDedAmt);
  if(s('prev-labor2'))s('prev-labor2').textContent=fmt(laborAmt);
  if(s('prev-ins2'))s('prev-ins2').textContent=fmt(insAmt);
  if(s('prev-net'))s('prev-net').textContent=fmt(net);
}
function saveInvoice(e,editId){
  e.preventDefault();const f=new FormData(e.target);
  const rows=document.getElementById('line-items').children;
  const items=[];let subtotal=0;
  Array.from(rows).forEach((row,i)=>{
    const desc=row.querySelector(`[name="item_desc_${i}"]`)?.value||'';
    const qty=parseFloat(row.querySelector(`[name="item_qty_${i}"]`)?.value)||0;
    const price=parseFloat(row.querySelector(`[name="item_price_${i}"]`)?.value)||0;
    const total=parseFloat((qty*price).toFixed(2));subtotal+=total;
    items.push({description:desc,qty,unitPrice:price,total});
  });
  const vatPercent=15;const vatAmount=parseFloat((subtotal*vatPercent/100).toFixed(2));
  const totalAfterTax=parseFloat((subtotal+vatAmount).toFixed(2));
  const taxDedPct=parseFloat(f.get('taxDeductionPercent'))||0;
  const laborPct=parseFloat(f.get('laborCertPercent'))||0;
  const insPct=parseFloat(f.get('insurancePercent'))||0;
  const taxDedAmt=parseFloat((totalAfterTax*taxDedPct/100).toFixed(2));
  const laborAmt=parseFloat((totalAfterTax*laborPct/100).toFixed(2));
  const insAmt=parseFloat((totalAfterTax*insPct/100).toFixed(2));
  const netReceivable=parseFloat((totalAfterTax-taxDedAmt-laborAmt-insAmt).toFixed(2));
  // Duplicate check
  const invNum=editId?state.invoices.find(i=>i.id===editId).invoiceNumber:document.querySelector('#invoice-form input[readonly]')?.value;
  const dupes=state.invoices.filter(i=>i.invoiceNumber===invNum&&i.id!==editId);
  if(dupes.length>0){showToast('Duplicate invoice number detected!','error');return;}

  if(editId){
    const inv=state.invoices.find(i=>i.id===editId);
    Object.assign(inv,{customerId:f.get('customerId'),invoiceDate:f.get('invoiceDate'),dueDate:f.get('dueDate'),items,subtotal,vatPercent,vatAmount,totalAfterTax,taxDeductionPercent:taxDedPct,taxDeductionAmount:taxDedAmt,laborCertPercent:laborPct,laborCertAmount:laborAmt,insurancePercent:insPct,insuranceAmount:insAmt,netReceivable,updatedAt:new Date().toISOString()});
    recalcInvoice(inv);addAudit('Updated','invoice',editId,'Invoice '+inv.invoiceNumber+' updated');
    showToast('Invoice updated successfully');
  }else{
    const inv={id:genId(),internalId:document.querySelectorAll('#invoice-form input[readonly]')[1]?.value,invoiceNumber:invNum,customerId:f.get('customerId'),invoiceDate:f.get('invoiceDate'),dueDate:f.get('dueDate'),items,subtotal,vatPercent,vatAmount,totalAfterTax,taxDeductionPercent:taxDedPct,taxDeductionAmount:taxDedAmt,laborCertPercent:laborPct,laborCertAmount:laborAmt,insurancePercent:insPct,insuranceAmount:insAmt,netReceivable,totalCollected:0,remainingBalance:netReceivable,status:'Unpaid',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    state.invoices.push(inv);addAudit('Created','invoice',inv.id,'Invoice '+inv.invoiceNumber+' created');
    showToast('Invoice created successfully');
  }
  saveState();navigateTo('invoices');
}
function deleteInvoice(id){
  openModal(`<div class="p-6 text-center"><div class="w-16 h-16 rounded-full bg-rose-500/15 flex items-center justify-center mx-auto mb-4"><i data-lucide="alert-triangle" class="w-8 h-8 text-rose-400"></i></div><h3 class="text-lg font-bold text-white mb-2">Delete Invoice</h3><p class="text-sm text-surface-400 mb-6">This action cannot be undone. All related collections and attachments will also be removed.</p><div class="flex gap-3 justify-center"><button onclick="closeModal()" class="btn-secondary px-5 py-2.5 rounded-xl text-sm">Cancel</button><button onclick="confirmDeleteInvoice('${id}')" class="px-5 py-2.5 rounded-xl text-sm bg-rose-500 hover:bg-rose-600 text-white font-medium transition-colors">Delete</button></div></div>`);
}
function confirmDeleteInvoice(id){
  state.collections=state.collections.filter(c=>c.invoiceId!==id);
  state.attachments=state.attachments.filter(a=>a.invoiceId!==id);
  state.invoices=state.invoices.filter(i=>i.id!==id);
  addAudit('Deleted','invoice',id,'Invoice deleted');
  saveState();closeModal();showToast('Invoice deleted','info');navigateTo('invoices');
}

function openAddCollection(invId){
  openModal(`<div class="p-6"><h3 class="text-lg font-bold text-white mb-4">Add Collection</h3>
  <form onsubmit="saveCollection(event,'${invId}')"><div class="space-y-4">
    <div><label class="block text-xs text-surface-500 mb-1">Collection Date</label><input type="date" name="collectionDate" value="${new Date().toISOString().split('T')[0]}" required class="w-full px-3 py-2.5 rounded-xl text-sm"></div>
    <div><label class="block text-xs text-surface-500 mb-1">Amount (SAR)</label><input type="number" name="amount" step="0.01" min="0.01" required class="w-full px-3 py-2.5 rounded-xl text-sm" placeholder="0.00"></div>
    <div><label class="block text-xs text-surface-500 mb-1">Reference Number</label><input type="text" name="referenceNumber" required class="w-full px-3 py-2.5 rounded-xl text-sm" placeholder="RCV-..."></div>
    <div><label class="block text-xs text-surface-500 mb-1">Notes</label><textarea name="notes" rows="2" class="w-full px-3 py-2.5 rounded-xl text-sm" placeholder="Optional notes"></textarea></div>
    <div class="flex gap-3 justify-end pt-2"><button type="button" onclick="closeModal()" class="btn-secondary px-5 py-2.5 rounded-xl text-sm">Cancel</button><button type="submit" class="btn-primary px-5 py-2.5 rounded-xl text-sm font-medium">Add Collection</button></div>
  </div></form></div>`);
}
function saveCollection(e,invId){
  e.preventDefault();const f=new FormData(e.target);
  const col={id:genId(),invoiceId:invId,collectionDate:f.get('collectionDate'),amount:parseFloat(f.get('amount')),referenceNumber:f.get('referenceNumber'),notes:f.get('notes')||'',createdAt:new Date().toISOString()};
  state.collections.push(col);
  const inv=state.invoices.find(i=>i.id===invId);if(inv)recalcInvoice(inv);
  addAudit('Collection Added','collection',col.id,'Collection '+col.referenceNumber+' of '+fmt(col.amount)+' SAR');
  saveState();closeModal();showToast('Collection added successfully');renderView();
}
function deleteCollection(colId,invId){
  state.collections=state.collections.filter(c=>c.id!==colId);
  const inv=state.invoices.find(i=>i.id===invId);if(inv)recalcInvoice(inv);
  addAudit('Collection Deleted','collection',colId,'Collection deleted');
  saveState();showToast('Collection removed','info');renderView();
}

// ---------- CUSTOMER DETAIL ----------
function renderCustomerDetail(){
  const c=state.customers.find(cu=>cu.id===state.viewParams);if(!c)return'<p class="text-surface-500">Customer not found</p>';
  const invs=state.invoices.filter(i=>i.customerId===c.id).sort((a,b)=>new Date(b.invoiceDate)-new Date(a.invoiceDate));
  const totalVal=invs.reduce((s,i)=>s+i.totalAfterTax,0);
  const totalCol=invs.reduce((s,i)=>s+i.totalCollected,0);
  const outstanding=invs.reduce((s,i)=>s+i.remainingBalance,0);
  const aging={current:0,d30:0,d60:0,d90:0,d90plus:0};
  const now=new Date();
  invs.forEach(inv=>{if(inv.status==='Fully Paid')return;const d=daysBetween(inv.dueDate,now);if(d<=0)aging.current+=inv.remainingBalance;else if(d<=30)aging.d30+=inv.remainingBalance;else if(d<=60)aging.d60+=inv.remainingBalance;else if(d<=90)aging.d90+=inv.remainingBalance;else aging.d90plus+=inv.remainingBalance;});

  return `
  <div class="flex items-center gap-3 mb-6">
    <button onclick="navigateTo('customers')" class="p-2 rounded-lg hover:bg-white/5"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
    <div class="flex-1"><h2 class="text-2xl font-bold text-white">${c.name}</h2><p class="text-sm text-surface-500 mt-0.5">${c.taxNumber}</p></div>
    <button onclick="navigateTo('customer-form','${c.id}')" class="btn-secondary px-3 py-2 rounded-xl text-xs flex items-center gap-1.5"><i data-lucide="pencil" class="w-3.5 h-3.5"></i>Edit</button>
  </div>
  <!-- Summary -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="glass rounded-xl p-4 text-center"><p class="text-lg font-bold text-white">${invs.length}</p><p class="text-xs text-surface-500">Total Invoices</p></div>
    <div class="glass rounded-xl p-4 text-center"><p class="text-lg font-bold text-white">${fmt(totalVal)}</p><p class="text-xs text-surface-500">Total Value</p></div>
    <div class="glass rounded-xl p-4 text-center"><p class="text-lg font-bold text-brand-400">${fmt(totalCol)}</p><p class="text-xs text-surface-500">Collected</p></div>
    <div class="glass rounded-xl p-4 text-center"><p class="text-lg font-bold text-amber-400">${fmt(outstanding)}</p><p class="text-xs text-surface-500">Outstanding</p></div>
  </div>
  <!-- Aging + Info -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <div class="glass rounded-2xl p-5">
      <h3 class="text-sm font-semibold text-white mb-3">Customer Info</h3>
      <div class="space-y-2 text-sm"><div><span class="text-surface-500">Contact:</span> <span class="text-surface-300 ml-2">${c.contactPerson||'-'}</span></div><div><span class="text-surface-500">Phone:</span> <span class="text-surface-300 ml-2">${c.phone||'-'}</span></div><div><span class="text-surface-500">Email:</span> <span class="text-surface-300 ml-2">${c.email||'-'}</span></div><div><span class="text-surface-500">Address:</span> <span class="text-surface-300 ml-2">${c.address||'-'}</span></div><div><span class="text-surface-500">Commercial Reg:</span> <span class="text-surface-300 ml-2">${c.commercialReg||'-'}</span></div>${c.notes?`<div><span class="text-surface-500">Notes:</span> <span class="text-surface-300 ml-2">${c.notes}</span></div>`:''}</div>
    </div>
    <div class="lg:col-span-2 glass rounded-2xl p-5">
      <h3 class="text-sm font-semibold text-white mb-3">Aging Breakdown</h3>
      <div class="grid grid-cols-5 gap-3">
        ${[{l:'Current',v:aging.current,c:'brand'},{l:'0-30 Days',v:aging.d30,c:'cyan'},{l:'31-60 Days',v:aging.d60,c:'amber'},{l:'61-90 Days',v:aging.d90,c:'orange'},{l:'90+ Days',v:aging.d90plus,c:'rose'}].map(a=>`
        <div class="text-center p-3 rounded-xl bg-${a.c}-500/5 border border-${a.c}-500/10"><p class="text-xs text-surface-500 mb-1">${a.l}</p><p class="text-sm font-bold text-${a.c}-400">${fmt(a.v)}</p></div>`).join('')}
      </div>
    </div>
  </div>
  <!-- Invoices -->
  <div class="glass rounded-2xl p-5">
    <div class="flex items-center justify-between mb-4"><h3 class="text-sm font-semibold text-white">Customer Invoices</h3><button onclick="exportCustomerStatement('${c.id}')" class="text-xs text-brand-400 hover:text-brand-300 flex items-center gap-1"><i data-lucide="file-down" class="w-3.5 h-3.5"></i>Export Statement</button></div>
    <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-surface-500 uppercase border-b border-white/5"><th class="text-left py-2 px-2">Invoice</th><th class="text-left py-2 px-2 hidden md:table-cell">Date</th><th class="text-right py-2 px-2">Amount</th><th class="text-right py-2 px-2 hidden sm:table-cell">Collected</th><th class="text-right py-2 px-2">Remaining</th><th class="text-center py-2 px-2">Status</th></tr></thead>
    <tbody>${invs.map(inv=>`<tr class="table-row border-b border-white/5 cursor-pointer" onclick="navigateTo('invoice-detail','${inv.id}')"><td class="py-2.5 px-2 text-white font-medium">${inv.invoiceNumber}</td><td class="py-2.5 px-2 text-surface-400 hidden md:table-cell">${fmtDate(inv.invoiceDate)}</td><td class="py-2.5 px-2 text-right text-surface-300">${fmt(inv.totalAfterTax)}</td><td class="py-2.5 px-2 text-right text-brand-400 hidden sm:table-cell">${fmt(inv.totalCollected)}</td><td class="py-2.5 px-2 text-right ${inv.remainingBalance>0?'text-amber-400':'text-surface-500'}">${fmt(inv.remainingBalance)}</td><td class="py-2.5 px-2 text-center">${statusBadge(inv.status)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;

function saveCustomer(e,editId){
  e.preventDefault();const f=new FormData(e.target);
  const data={name:f.get('name'),taxNumber:f.get('taxNumber')||'',commercialReg:f.get('commercialReg')||'',contactPerson:f.get('contactPerson')||'',phone:f.get('phone')||'',email:f.get('email')||'',address:f.get('address')||'',notes:f.get('notes')||''};
  if(editId){Object.assign(state.customers.find(c=>c.id===editId),data,{updatedAt:new Date().toISOString()});addAudit('Updated','customer',editId,'Customer '+data.name+' updated');showToast('Customer updated');}
  else{data.id=genId();data.createdAt=new Date().toISOString();state.customers.push(data);addAudit('Created','customer',data.id,'Customer '+data.name+' created');showToast('Customer created');}
  saveState();navigateTo('customers');
}

function renderAging(){
  const now=new Date();const cats=['Current','0-30 Days','31-60 Days','61-90 Days','Over 90 Days'];

  const agingData=cats.map((_,i)=>{const[rMin,rMax]=ranges[i];return state.invoices.filter(inv=>{if(inv.status==='Fully Paid')return false;const d=daysBetween(inv.dueDate,now);if(rMin===null)return d<=0;return d>=rMin&&d<=rMax;});});
  const totals=agingData.map(arr=>arr.reduce((s,inv)=>s+inv.remainingBalance,0));

  return `

    ${cats.map((cat,i)=>{const colors=['brand','cyan','amber','orange','rose'];return`<div class="glass rounded-xl p-4 text-center border-${colors[i]}-500/20"><p class="text-xs text-surface-500 mb-1">${cat}</p><p class="text-lg font-bold text-${colors[i]}-400">${fmt(totals[i])}</p><p class="text-xs text-surface-500">${counts[i]} invoices</p></div>`;}).join('')}
  </div>
  <div class="glass rounded-2xl p-5 mb-6"><h3 class="text-sm font-semibold text-white mb-4">Aging Distribution</h3><div class="h-48"><canvas id="aging-chart"></canvas></div></div>
  <div class="glass rounded-2xl p-5">
    <h3 class="text-sm font-semibold text-white mb-4">Customer Aging Breakdown</h3>
    <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-surface-500 uppercase border-b border-white/5"><th class="text-left py-2 px-2">Customer</th>${cats.map(c=>`<th class="text-right py-2 px-2">${c}</th>`).join('')}<th class="text-right py-2 px-2">Total</th></tr></thead>
    <tbody>${state.customers.map(cust=>{const custInvs=state.invoices.filter(i=>i.customerId===cust.id&&i.status!=='Fully Paid');if(custInvs.length===0)return'';const row=cats.map((_,i)=>{const[rMin,rMax]=ranges[i];return custInvs.filter(inv=>{const d=daysBetween(inv.dueDate,now);if(rMin===null)return d<=0;return d>=rMin&&d<=rMax;}).reduce((s,inv)=>s+inv.remainingBalance,0);});const total=row.reduce((s,v)=>s+v,0);if(total===0)return'';return`<tr class="table-row border-b border-white/5"><td class="py-2.5 px-2 text-surface-300">${cust.name}</td>${row.map(v=>`<td class="py-2.5 px-2 text-right ${v>0?'text-amber-400':'text-surface-600'}">${v>0?fmt(v):'-'}</td>`).join('')}<td class="py-2.5 px-2 text-right font-medium text-white">${fmt(total)}</td></tr>`;}).join('')}

        <th class="text-left py-2 px-2">Customer</th>${cats.map(c => '<th class="text-right py-2 px-2">' + c + '</th>').join('')}<th class="text-right py-2 px-2">Total</th>
      </tr></thead>
      <tbody>
        ${state.customers.map(cust => {
          const custInvs = state.invoices.filter(i => i.customerId === cust.id && i.status !== 'Fully Paid');
          if (custInvs.length === 0) return '';
          const row = cats.map((_, i) => {
            const [rMin, rMax] = ranges[i];
            return custInvs.filter(inv => {
              const d = daysBetween(inv.dueDate, now);
              if (rMin === null) return d <= 0;
              return d >= rMin && d <= rMax;
            }).reduce((s, inv) => s + inv.remainingBalance, 0);
          });
          const total = row.reduce((s, v) => s + v, 0);
          if (total === 0) return '';
          return '<tr class="table-row border-b border-white/5"><td class="py-2.5 px-2 text-surface-300 text-xs">' + cust.name + '</td>' +
            row.map(v => '<td class="py-2.5 px-2 text-right text-xs ' + (v > 0 ? 'text-amber-400' : 'text-surface-600') + '">' + (v > 0 ? fmt(v) : '-') + '</td>').join('') +
            '<td class="py-2.5 px-2 text-right font-medium text-white text-xs">' + fmt(total) + '</td></tr>';
        }).join('')}
        <tr class="border-t border-white/10 font-bold">
          <td class="py-3 px-2 text-white text-xs">Grand Total</td>
          ${totals.map(t => '<td class="py-3 px-2 text-right text-white text-xs">' + fmt(t) + '</td>').join('')}
          <td class="py-3 px-2 text-right text-brand-400 text-sm">${fmt(grandTotal)}</td>
        </tr>
      </tbody>
    </table></div>
  </div>`;
}

function generateStatement() {
  const custId = document.getElementById('stmt-customer')?.value;
  if (!custId) { showToast('Please select a customer', 'warning'); return; }
  const c = state.customers.find(cu => cu.id === custId);
  if (!c) return;
  const invs = state.invoices.filter(i => i.customerId === custId).sort((a, b) => new Date(a.invoiceDate) - new Date(b.invoiceDate));
  const cols = state.collections.filter(col => invs.some(i => i.id === col.invoiceId)).sort((a, b) => new Date(a.collectionDate) - new Date(b.collectionDate));
  const totalInvoiced = invs.reduce((s, i) => s + i.totalAfterTax, 0);
  const totalDeductions = invs.reduce((s, i) => s + i.taxDeductionAmount + i.laborCertAmount + i.insuranceAmount, 0);
  const totalCollected = cols.reduce((s, c) => s + c.amount, 0);
  const balance = totalInvoiced - totalDeductions - totalCollected;

  state._stmtData = { customer: c, invoices: invs, collections: cols, totalInvoiced, totalDeductions, totalCollected, balance };

  document.getElementById('statement-output').innerHTML = `
  <div class="glass rounded-2xl p-6 fade-in">
    <div class="flex justify-between items-start mb-6">
      <div>
        <h3 class="text-lg font-bold text-white">${c.name}</h3>
        <p class="text-xs text-surface-500">Tax: ${c.taxNumber} &middot; ${c.address || ''}</p>
      </div>
      <div class="text-right"><p class="text-xs text-surface-500">Statement Date</p><p class="text-sm text-white">${fmtDate(new Date())}</p></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="p-3 rounded-xl bg-white/5 text-center"><p class="text-xs text-surface-500">Invoiced</p><p class="text-sm font-bold text-white">${fmt(totalInvoiced)}</p></div>
      <div class="p-3 rounded-xl bg-rose-500/5 text-center"><p class="text-xs text-surface-500">Deductions</p><p class="text-sm font-bold text-rose-400">-${fmt(totalDeductions)}</p></div>
      <div class="p-3 rounded-xl bg-brand-500/5 text-center"><p class="text-xs text-surface-500">Collected</p><p class="text-sm font-bold text-brand-400">-${fmt(totalCollected)}</p></div>
      <div class="p-3 rounded-xl ${balance > 0 ? 'bg-amber-500/10' : 'bg-brand-500/10'} text-center"><p class="text-xs text-surface-500">Balance</p><p class="text-sm font-bold ${balance > 0 ? 'text-amber-400' : 'text-brand-400'}">${fmt(balance)}</p></div>
    </div>
    <h4 class="text-sm font-semibold text-white mb-3">Invoices</h4>
    <div class="overflow-x-auto mb-6"><table class="w-full text-sm"><thead><tr class="text-xs text-surface-500 border-b border-white/5"><th class="text-left py-2 px-2">Number</th><th class="text-left py-2 px-2">Date</th><th class="text-right py-2 px-2">Amount</th><th class="text-right py-2 px-2">Deductions</th><th class="text-right py-2 px-2">Net</th></tr></thead>
    <tbody>${invs.map(i => {
      const ded = i.taxDeductionAmount + i.laborCertAmount + i.insuranceAmount;
      return '<tr class="border-b border-white/5"><td class="py-2 px-2 text-white">' + i.invoiceNumber + '</td><td class="py-2 px-2 text-surface-400">' + fmtDate(i.invoiceDate) + '</td><td class="py-2 px-2 text-right text-surface-300">' + fmt(i.totalAfterTax) + '</td><td class="py-2 px-2 text-right text-rose-400">-' + fmt(ded) + '</td><td class="py-2 px-2 text-right text-white">' + fmt(i.totalAfterTax - ded) + '</td></tr>';
    }).join('')}</tbody></table></div>
    <h4 class="text-sm font-semibold text-white mb-3">Collections</h4>
    <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-surface-500 border-b border-white/5"><th class="text-left py-2 px-2">Reference</th><th class="text-left py-2 px-2">Date</th><th class="text-right py-2 px-2">Amount</th></tr></thead>
    <tbody>${cols.map(col => '<tr class="border-b border-white/5"><td class="py-2 px-2 text-white">' + col.referenceNumber + '</td><td class="py-2 px-2 text-surface-400">' + fmtDate(col.collectionDate) + '</td><td class="py-2 px-2 text-right text-brand-400">' + fmt(col.amount) + '</td></tr>').join('')}</tbody></table></div>
  </div>`;
  lucide.createIcons({ nodes: [document.getElementById('statement-output')] });
}

function saveSettings(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  state.settings = {
    companyName: f.get('companyName'), address: f.get('address'), phone: f.get('phone'),
    email: f.get('email'), taxNumber: f.get('taxNumber'), commercialReg: f.get('commercialReg')
  };
  saveState(); showToast('Settings saved successfully');
}

function resetData() {
  openModal('<div class="p-6 text-center"><div class="w-16 h-16 rounded-full bg-rose-500/15 flex items-center justify-center mx-auto mb-4"><i data-lucide="alert-triangle" class="w-8 h-8 text-rose-400"></i></div><h3 class="text-lg font-bold text-white mb-2">Reset All Data</h3><p class="text-sm text-surface-400 mb-6">This will delete everything and regenerate fresh sample data. This cannot be undone.</p><div class="flex gap-3 justify-center"><button onclick="closeModal()" class="btn-secondary px-5 py-2.5 rounded-xl text-sm">Cancel</button><button onclick="confirmReset()" class="px-5 py-2.5 rounded-xl text-sm bg-rose-500 hover:bg-rose-600 text-white font-medium">Reset</button></div></div>');
}
function confirmReset() {
  localStorage.removeItem(APP_KEY);
  generateSampleData();
  closeModal(); showToast('Data reset with fresh samples', 'info'); navigateTo('dashboard');
}
function exportAllData() {
  const data = JSON.stringify({ invoices: state.invoices, customers: state.customers, collections: state.collections, auditLogs: state.auditLogs, settings: state.settings }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'axentro_backup_' + new Date().toISOString().split('T')[0] + '.json';
  a.click(); URL.revokeObjectURL(url); showToast('Data exported as JSON');
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.invoices && d.customers) {
        state.invoices = d.invoices; state.customers = d.customers;
        if (d.collections) state.collections = d.collections;
        if (d.auditLogs) state.auditLogs = d.auditLogs;
        if (d.settings) state.settings = d.settings;
        saveState(); showToast('Data imported successfully'); navigateTo('dashboard');
      } else { showToast('Invalid file format', 'error'); }
    } catch (err) { showToast('Failed to parse file', 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===================== GLOBAL SEARCH =====================
function showSearchPanel() {
  document.getElementById('search-panel').classList.remove('hidden');
  const inp = document.getElementById('search-panel-input');
  inp.value = document.getElementById('global-search').value;
  setTimeout(() => inp.focus(), 100);
}
function hideSearchPanel() { document.getElementById('search-panel').classList.add('hidden'); }

function handleGlobalSearch(q) {
  const results = document.getElementById('search-results');
  if (!q || q.length < 2) {
    results.innerHTML = '<p class="p-4 text-sm text-surface-500 text-center">Type at least 2 characters to search</p>';
    return;
  }
  const s = q.toLowerCase();
  const invResults = state.invoices.filter(i => i.invoiceNumber.toLowerCase().includes(s) || i.internalId.toLowerCase().includes(s)).slice(0, 5);
  const custResults = state.customers.filter(c => c.name.toLowerCase().includes(s) || c.taxNumber.includes(s)).slice(0, 5);
  const taxResults = state.invoices.filter(i => getCustomer(i.customerId).taxNumber.toLowerCase().includes(s)).slice(0, 3);

  let html = '';
  if (custResults.length) {
    html += '<div class="px-3 py-2"><p class="text-[10px] text-surface-500 uppercase tracking-wider">Customers</p></div>';
    custResults.forEach(c => {
      html += '<button class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-white/5 flex items-center gap-3" onclick="hideSearchPanel();navigateTo(\'customer-detail\',\'' + c.id + '\')">' +
        '<i data-lucide="users" class="w-4 h-4 text-surface-500"></i>' +
        '<div class="flex-1 min-w-0"><p class="text-sm text-white truncate">' + c.name + '</p><p class="text-xs text-surface-500">' + c.taxNumber + '</p></div></button>';
    });
  }
  if (invResults.length) {
    html += '<div class="px-3 py-2 mt-1"><p class="text-[10px] text-surface-500 uppercase tracking-wider">Invoices</p></div>';
    invResults.forEach(inv => {
      html += '<button class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-white/5 flex items-center gap-3" onclick="hideSearchPanel();navigateTo(\'invoice-detail\',\'' + inv.id + '\')">' +
        '<i data-lucide="file-text" class="w-4 h-4 text-surface-500"></i>' +
        '<div class="flex-1 min-w-0"><p class="text-sm text-white">' + inv.invoiceNumber + '</p><p class="text-xs text-surface-500">' + getCustomer(inv.customerId).name + ' &middot; ' + fmt(inv.totalAfterTax) + '</p></div>' +
        statusBadge(inv.status) + '</button>';
    });
  }
  if (taxResults.length && !custResults.length) {
    html += '<div class="px-3 py-2 mt-1"><p class="text-[10px] text-surface-500 uppercase tracking-wider">Tax Number Matches</p></div>';
    taxResults.forEach(inv => {
      html += '<button class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-white/5 flex items-center gap-3" onclick="hideSearchPanel();navigateTo(\'invoice-detail\',\'' + inv.id + '\')">' +
        '<i data-lucide="search" class="w-4 h-4 text-surface-500"></i>' +
        '<div class="flex-1 min-w-0"><p class="text-sm text-white">' + inv.invoiceNumber + '</p><p class="text-xs text-surface-500">' + getCustomer(inv.customerId).taxNumber + '</p></div></button>';
    });
  }
  if (!html) html = '<p class="p-4 text-sm text-surface-500 text-center">No results found for "' + q + '"</p>';
  results.innerHTML = html;
  lucide.createIcons({ nodes: [results] });
}

function exportAgingPDF() {
  const doc = getPDFConfig();
  let y = 35;
  doc.setTextColor(30, 30, 30); doc.setFontSize(14); doc.setFont(undefined, 'bold');
  doc.text('Accounts Receivable Aging Report', 15, y); y += 5;
  doc.setFontSize(8); doc.setFont(undefined, 'normal'); doc.setTextColor(100, 100, 100);
  doc.text('As of ' + fmtDate(new Date()), 15, y); y += 8;
  const now = new Date();
  const ranges = [[null, 0], [0, 30], [31, 60], [61, 90], [91, 99999]];
  const rows = state.customers.map(cust => {
    const invs = state.invoices.filter(i => i.customerId === cust.id && i.status !== 'Fully Paid');
    if (invs.length === 0) return null;
    const row = ranges.map(([rMin, rMax]) => {
      return invs.filter(inv => {
        const d = daysBetween(inv.dueDate, now);
        if (rMin === null) return d <= 0;
        return d >= rMin && d <= rMax;
      }).reduce((s, inv) => s + inv.remainingBalance, 0);
    });
    const total = row.reduce((s, v) => s + v, 0);
    if (total === 0) return null;
    return [cust.name, ...row.map(v => v > 0 ? fmt(v) : '-'), fmt(total)];
  }).filter(Boolean);

  doc.autoTable({
    startY: y, margin: { left: 10, right: 10 },
    head: [['Customer', 'Current', '0-30', '31-60', '61-90', '90+', 'Total']],
    body: rows,
    headStyles: { fillColor: [16, 185, 129], fontSize: 7, textColor: 255 },
    bodyStyles: { fontSize: 7 },
    columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right', fontStyle: 'bold' } }
  });
  addPDFFooter(doc);
  doc.save('Aging_Report_' + new Date().toISOString().split('T')[0] + '.pdf');
  showToast('Aging report PDF exported');
}

// ===================== CSV EXPORT FUNCTIONS =====================
function downloadCSV(filename, csvContent) {
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV exported');
}

function exportInvoicesCSV() {

  const rows = state.invoices.map(inv => {
    const c = getCustomer(inv.customerId);
    return [inv.invoiceNumber, inv.internalId, c.name, c.taxNumber, inv.invoiceDate, inv.dueDate, inv.subtotal, inv.vatPercent, inv.vatAmount, inv.totalAfterTax, inv.taxDeductionPercent, inv.taxDeductionAmount, inv.laborCertPercent, inv.laborCertAmount, inv.insurancePercent, inv.insuranceAmount, inv.netReceivable, inv.totalCollected, inv.remainingBalance, inv.status];
  });
  downloadCSV('Invoices_' + new Date().toISOString().split('T')[0] + '.csv', [headers, ...rows].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'));
}

    const row = ranges.map(([rMin, rMax]) => invs.filter(inv => {

// ===================== THEME TOGGLE =====================
function toggleTheme() {
  state.darkMode = !state.darkMode;
  document.documentElement.classList.toggle('dark', state.darkMode);
  document.body.className = state.darkMode ? 'bg-surface-950 text-surface-200' : 'bg-surface-50 text-surface-800';
  // Re-render charts with new theme colors
  if (chartInstances.revenue || chartInstances.customer || chartInstances.monthly || chartInstances.aging || chartInstances.colTrend) {
    renderView();
  }
  lucide.createIcons();
}

// ===================== KEYBOARD SHORTCUTS =====================
document.addEventListener('keydown', function(e) {
  // "/" to focus search
  if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById('global-search').focus();
  }
  // Escape to close modals/search
  if (e.key === 'Escape') {
    closeModal();
    hideSearchPanel();
  }
});

// ===================== PWA SERVICE WORKER =====================
if ('serviceWorker' in navigator) {
  // Register a minimal service worker for PWA installability
  const swCode = `
    const CACHE_NAME = 'axentro-v1';
    const URLS_TO_CACHE = ['/'];
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {
    // Service worker registration may fail on some environments (file://, etc.) - that's fine
  });
}

// ===================== APPLICATION INITIALIZATION =====================
function initApp() {
  // Load saved data or generate samples
  const loaded = loadState();
  if (!loaded) {
    generateSampleData();
  }

  // Apply theme
  document.documentElement.classList.toggle('dark', state.darkMode);
  if (!state.darkMode) {
    document.body.className = 'bg-surface-50 text-surface-800';
  }

  // Update notification badge
  updateNotifBadge();

  // Render sidebar
  renderSidebar();

  // Handle hash routing
  const hash = window.location.hash.replace('#', '');
  if (hash && hash !== state.currentView) {
    state.currentView = hash;
  }

  // Initial render
  renderView();
  updateFab();

  // Initialize Lucide icons globally
  lucide.createIcons();

  console.log('%c AXENTRO Invoice Management System ', 'background:#10b981;color:white;font-size:14px;font-weight:bold;padding:4px 8px;border-radius:4px;');
  console.log('%c Enterprise Accounts Receivable System v1.0 ', 'color:#10b981;font-size:10px;');
}

// Hash change listener for browser back/forward
window.addEventListener('hashchange', function() {
  const hash = window.location.hash.replace('#', '');
  if (hash && hash !== state.currentView) {
    state.currentView = hash;
    state.viewParams = null;
    renderSidebar();
    renderView();
    updateFab();
  }
});

// Start the application
document.addEventListener('DOMContentLoaded', initApp);
// Fallback if DOM is already loaded
if (document.readyState !== 'loading') initApp();

// Close search panel on outside click
document.addEventListener('click', function(e) {
  const panel = document.getElementById('search-panel');
  const searchInputs = [document.getElementById('global-search'), document.getElementById('search-panel-input')];
  if (panel && !panel.classList.contains('hidden')) {
    if (!panel.contains(e.target) && !searchInputs.includes(e.target)) {
      hideSearchPanel();
    }
  }
});
